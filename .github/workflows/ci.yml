name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The tests write real bookings to one shared database, so never run two at once.
concurrency:
  group: ci-test-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Repository secrets (Settings > Secrets and variables > Actions).
      # DATABASE_URL must point at a dedicated Neon TEST branch, never production.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      - name: Create tables and seed flights (idempotent)
        run: npm run db:setup

      - name: Unit and Playwright tests
        run: npm test

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/playwright-html
            reports/playwright-junit.xml
            reports/vitest-junit.xml
            reports/vitest-html
            reports/coverage
          retention-days: 14

      - name: Upload failure traces and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: reports/playwright-artifacts
          retention-days: 7
